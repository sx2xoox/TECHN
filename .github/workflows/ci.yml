name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: typecheck · unit · compile benchmark · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run bench:compile
      - run: npm run build

  integration:
    name: real PostgreSQL 16 + real Docker
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - name: start a container for the Docker adapter test
        run: docker run -d --name iso-web busybox:1.36 sh -c 'while true; do sleep 1; done'
      - run: npx vitest run packages/adapters/test/real.test.ts
        env:
          ISOMORPH_TEST_PG_URL: postgres://postgres@127.0.0.1:5432/postgres
          ISOMORPH_TEST_DOCKER: '1'

  e2e:
    name: browser end-to-end demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm i --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e -- --shots e2e-screenshots
      - name: user-study kit self-test (bots, not data)
        run: npm run study:selftest -- --shots e2e-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e-screenshots

  docker:
    name: container image (build + smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t isomorph:ci .
      - name: refuses to listen on 0.0.0.0 without access tokens
        run: |
          if docker run --rm isomorph:ci connect otel --host 0.0.0.0; then echo "should have refused (no operator token)"; exit 1; fi
          if docker run --rm -e ISOMORPH_TOKEN=x isomorph:ci connect otel --host 0.0.0.0; then echo "should have refused (no OTLP token)"; exit 1; fi
      - name: OpenTelemetry traces become a world inside the container
        run: |
          docker run -d --name iso -p 4000:4000 -p 4318:4318 -e ISOMORPH_TOKEN=ci-token -e ISOMORPH_OTLP_TOKEN=otlp-token isomorph:ci
          for i in $(seq 1 60); do curl -sf -H 'authorization: Bearer ci-token' http://127.0.0.1:4000/api/hello | grep -q '"running"' && break; sleep 1; done
          curl -sf -H 'authorization: Bearer ci-token' http://127.0.0.1:4000/api/hello | grep -q '"running"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' --data @examples/otel/sample-otlp.json http://127.0.0.1:4318/v1/traces)" = "401"
          curl -sf -X POST -H 'content-type: application/json' -H 'authorization: Bearer otlp-token' --data @examples/otel/sample-otlp.json http://127.0.0.1:4318/v1/traces
          sleep 4
          curl -sf -H 'authorization: Bearer ci-token' http://127.0.0.1:4000/api/world | grep -q '"payments"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4000/api/hello)" = "401"
      - if: failure()
        run: docker logs iso || true
