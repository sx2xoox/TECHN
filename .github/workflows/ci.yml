name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: typecheck · unit · compile benchmark · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run bench:compile
      - name: root-cause engine benchmark (fails if the engine ever points outside the true causal path)
        run: npm run bench:rca -- --seeds 30 --fail-on-wrong
      - run: npm run build

  integration:
    name: real PostgreSQL 16 + real Docker
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - name: start a container for the Docker adapter test
        run: docker run -d --name iso-web busybox:1.36 sh -c 'while true; do sleep 1; done'
      - run: npx vitest run packages/adapters/test/real.test.ts
        env:
          ISOMORPH_TEST_PG_URL: postgres://postgres@127.0.0.1:5432/postgres
          ISOMORPH_TEST_DOCKER: '1'

  kubernetes:
    name: real Kubernetes (kind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - uses: helm/kind-action@v1
        with:
          cluster_name: isomorph
      - name: a healthy deployment, one whose image cannot be pulled, and a payments backend
        run: |
          kubectl create deployment web --image=nginx:1.27-alpine --replicas=2
          kubectl create deployment broken --image=registry.invalid/isomorph/does-not-exist:1
          kubectl create deployment payments --image=nginx:1.27-alpine --replicas=2
          kubectl expose deployment payments --type=NodePort --port=80
          kubectl rollout status deployment/web --timeout=180s
          kubectl rollout status deployment/payments --timeout=180s
          kubectl config view --raw -o json --minify > /tmp/kubeconfig.json
          ip=$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}')
          port=$(kubectl get svc payments -o jsonpath='{.spec.ports[0].nodePort}')
          for i in $(seq 1 30); do curl -sf "http://$ip:$port/" > /dev/null && break; sleep 1; done
          echo "ISOMORPH_TEST_PAYMENTS_URL=http://$ip:$port/" >> "$GITHUB_ENV"
      - run: npx vitest run packages/server/test/kubernetes.real.test.ts
        env:
          ISOMORPH_TEST_KUBECONFIG: /tmp/kubeconfig.json
      - name: one world of the cluster and real services that call it (failure is caused, not faked)
        run: npx vitest run packages/server/test/stack.real.test.ts
        env:
          ISOMORPH_TEST_KUBECONFIG: /tmp/kubeconfig.json
      - name: one command with the default YAML kubeconfig (no kubectl involved)
        run: |
          npm run isomorph -- connect kubernetes --port 4100 > /tmp/iso.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:4100/api/hello | grep -q '"running"' && break; sleep 1; done
          curl -sf http://127.0.0.1:4100/api/world | grep -q 'default/web'
          curl -sf http://127.0.0.1:4100/api/world | grep -q 'schema_deployments_ready_replicas_replicas'
      - name: one command for several systems (cluster + trace receiver)
        run: |
          npm run isomorph -- connect kubernetes otel --port 4101 > /tmp/iso-stack.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:4101/api/hello | grep -q '"running"' && break; sleep 1; done
          curl -sf -X POST -H 'content-type: application/json' --data @examples/otel/sample-otlp.json http://127.0.0.1:4318/v1/traces
          sleep 3
          curl -sf http://127.0.0.1:4101/api/world | grep -q 'otel_services:payments'
          curl -sf http://127.0.0.1:4101/api/world | grep -q 'k8s_deployments:default/payments'
          curl -sf http://127.0.0.1:4101/api/hello | grep -q 'k8s · '
      - name: cluster state on failure
        if: failure()
        run: |
          kubectl get deploy,rs,pods,events -A -o wide | tail -60
          cat /tmp/iso.log || true
          cat /tmp/iso-stack.log || true

  e2e:
    name: browser end-to-end demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm i --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e -- --shots e2e-screenshots
      - name: shareable snapshot opens offline, read-only, without sensitive values
        run: npm run e2e:snapshot -- --shots e2e-screenshots
      - name: one world for a cluster and its services (cross-system diagnosis)
        run: npm run e2e:stack -- --shots e2e-screenshots
      - name: user-study kit self-test (bots, not data)
        run: npm run study:selftest -- --shots e2e-screenshots
      - name: root-cause study task self-test (bots, not data)
        run: npm run study:selftest:rca -- --shots e2e-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e-screenshots

  docker:
    name: container image (build + smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t isomorph:ci .
      - name: refuses to listen on 0.0.0.0 without access tokens
        run: |
          if docker run --rm isomorph:ci connect otel --host 0.0.0.0; then echo "should have refused (no operator token)"; exit 1; fi
          if docker run --rm -e ISOMORPH_TOKEN=x isomorph:ci connect otel --host 0.0.0.0; then echo "should have refused (no OTLP token)"; exit 1; fi
      - name: OpenTelemetry traces become a world inside the container
        run: |
          docker run -d --name iso -p 4000:4000 -p 4318:4318 -e ISOMORPH_TOKEN=ci-token -e ISOMORPH_OTLP_TOKEN=otlp-token isomorph:ci
          for i in $(seq 1 60); do curl -sf -H 'authorization: Bearer ci-token' http://127.0.0.1:4000/api/hello | grep -q '"running"' && break; sleep 1; done
          curl -sf -H 'authorization: Bearer ci-token' http://127.0.0.1:4000/api/hello | grep -q '"running"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' --data @examples/otel/sample-otlp.json http://127.0.0.1:4318/v1/traces)" = "401"
          curl -sf -X POST -H 'content-type: application/json' -H 'authorization: Bearer otlp-token' --data @examples/otel/sample-otlp.json http://127.0.0.1:4318/v1/traces
          sleep 4
          curl -sf -H 'authorization: Bearer ci-token' http://127.0.0.1:4000/api/world | grep -q '"payments"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4000/api/hello)" = "401"
      - if: failure()
        run: docker logs iso || true
